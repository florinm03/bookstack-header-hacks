<!-- Custom Hack: anchor link at headers like in GitHub -->
<!-- Credit: https://github.com/Vlad118 -->

<style>
    /* 1. Prevent the header text and icon from splitting onto two lines */
    /* white-space: nowrap; */
    h1, h2, h3, h4, h5, h6 {
        position: relative;
    }

    /* 2. Ensure any internal <br> tags added by the editor are ignored */
    h1 br, h2 br, h3 br, h4 br, h5 br, h6 br {
        display: none;
    }
  
    /* Styling the anchor link icon */
    .header-anchor {
        text-decoration: none;
        color: #ccc;
        position: absolute;
        left: -25px;
        top: 50%;
        transform: translateY(-50%);
        opacity: 0;
        transition: opacity 0.2s ease-in-out;
        font-size: 16px;
        vertical-align: middle;
        display: inline-block;
        width: 16px;
        height: 16px;
    }

    /* Show the icon when hovering over the header or the icon itself */
    h1:not(#bkmrk-page-title):hover .header-anchor,
    h2:hover .header-anchor, 
    h3:hover .header-anchor, 
    h4:hover .header-anchor, 
    h5:hover .header-anchor, 
    h6:hover .header-anchor {
        opacity: 1;
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Fallback function for older browsers or non-HTTPS sites
        function copyToClipboardFallback(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            textArea.style.top = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
            } catch (err) {
                console.error('Fallback copy failed', err);
            }
            document.body.removeChild(textArea);
        }

        const headers = document.querySelectorAll('.page-content h1:not(#bkmrk-page-title), .page-content h2, .page-content h3, .page-content h4, .page-content h5, .page-content h6');

        headers.forEach(header => {
            if (header.id) {
                const anchor = document.createElement('a');
                anchor.className = 'header-anchor';
                anchor.href = '#' + header.id;
                anchor.innerHTML = '';
                anchor.title = 'Copy link to this section';
                
                anchor.addEventListener('click', function(e) {
                    e.preventDefault();
                    const fullUrl = window.location.origin + window.location.pathname + window.location.search + '#' + header.id;
                    
                    // Try modern API first, then fallback
                    if (navigator.clipboard && window.isSecureContext) {
                        navigator.clipboard.writeText(fullUrl).catch(() => copyToClipboardFallback(fullUrl));
                    } else {
                        copyToClipboardFallback(fullUrl);
                    }
                    
                    // Visual feedback
                    this.classList.add('copied');
                    setTimeout(() => this.classList.remove('copied'), 1500);
                    
                    history.pushState(null, null, '#' + header.id);
                });

                header.prepend(anchor);
            }
        });
    });
</script>
