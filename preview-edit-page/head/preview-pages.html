<!-- Page Preview - Click on the eye to preview page -->
<!-- Credit: https://github.com/florinm03 -->

<style>
    .page-preview-container {
        position: relative;
        border: 1px solid var(--color-border);
        border-radius: 6px;
        background: var(--color-page-content);

        margin-top: 8px;
        margin-bottom: 1rem;

        display: flex;
        flex-direction: column;
        transition: border-color 0.2s ease, outline 0.2s ease, box-shadow 0.2s ease;
    }

    .page-preview-container:has(.custom-page-preview.is-open) {
        outline: 2px solid var(--color-primary);
        outline-offset: 4px;
        margin-left: 12px;
        margin-right: 8px;
    }

    .page-preview-container .entity-list-item {
        position: relative;
        border: none;
        margin-bottom: 0;
        background: var(--color-lighter);
        border-radius: 6px;
        padding: 12px 16px;
        padding-right: 50px;
        transition: border-radius 0.2s;
    }

    .page-preview-container .entity-item-snippet { display: none; }

    .custom-page-preview {
        display: none;
        position: relative;
        max-height: 350px;
        overflow-x: hidden;
        word-wrap: break-word;
        overflow-y: auto;
        color: var(--color-text);
        font-size: 0.85em;
        border-top: 1px solid var(--color-border);
        min-width: 0;
    }

    .custom-page-preview pre {
        max-width: 100%;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-word;
    }

    .custom-page-preview.is-open {
        display: block;
    }

    .page-preview-container:has(.custom-page-preview.is-open) .entity-list-item {
        border-radius: 6px 6px 0 0;
    }

    .custom-page-preview .preview-inner { padding: 16px; }

    .custom-page-preview h1 { font-size: 1.4em !important; margin-top: 0; margin-bottom: 10px; }
    .custom-page-preview h2 { font-size: 1.2em !important; margin-top: 10px; margin-bottom: 8px; }
    .custom-page-preview h3 { font-size: 1.1em !important; margin-top: 10px; margin-bottom: 8px; }
    .custom-page-preview h4, .custom-page-preview h5 { font-size: 1em !important; }
    .custom-page-preview img, .custom-page-preview iframe { max-width: 100%; height: auto; }

    .custom-page-preview::-webkit-scrollbar { width: 8px; }
    .custom-page-preview::-webkit-scrollbar-track { background: transparent; }
    .custom-page-preview::-webkit-scrollbar-corner { background: transparent; }
    .custom-page-preview::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 4px; }
    .custom-page-preview::-webkit-scrollbar-thumb:hover { background: var(--color-primary); }
    html.dark-mode .custom-page-preview::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); }
    html.dark-mode .custom-page-preview::-webkit-scrollbar-thumb:hover { background: var(--color-primary); }

    .page-preview-actions {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 10;
        display: flex;
        gap: 8px;
    }

    .quick-view-btn {
        background: transparent;
        border: 1px solid var(--color-border);
        border-radius: 4px;
        color: #ccc;
        cursor: pointer;
        padding: 4px 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        opacity: 0;
        visibility: hidden;
        outline: none;
    }

    .page-preview-container:not(:has(.custom-page-preview.is-open)):hover .quick-view-btn {
        opacity: 1;
        visibility: visible;
    }

    .page-preview-container:has(.custom-page-preview.is-open) .quick-view-btn {
        opacity: 1;
        visibility: visible;
    }

    .quick-view-btn svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
        pointer-events: none;
    }

    .book-contents > a.chapter.entity-list-item.has-children {
        padding-right: 45px;
    }

    .book-contents > a.chapter.entity-list-item:hover .chapter-expand-all-btn,
    .chapter-expand-all-btn.is-open {
        opacity: 1;
        visibility: visible;
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const pageLinks = document.querySelectorAll('.book-contents a.entity-list-item[data-entity-type="page"]');
        if (pageLinks.length === 0) return;

        const iconEye = `<svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>`;
        const iconEyeOff = `<svg viewBox="0 0 24 24"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/></svg>`;
        
        // const overlapStyle = "margin-left: -6px; stroke: var(--color-page-content); stroke-width: 3px; paint-order: stroke;";
        // const iconEyeDouble = `<span style="display:flex;">${iconEye}${iconEye.replace('<svg', `<svg style="${overlapStyle}"`)}</span>`;
        // const iconEyeOffDouble = `<span style="display:flex;">${iconEyeOff}${iconEyeOff.replace('<svg', `<svg style="${overlapStyle}"`)}</span>`;
        const iconEyeDouble = `<svg viewBox="0 0 7.7232356 4.5976562" style="width: 22px; height: 18px;"><path d="m 4.49792,0.31406 c -1.32292,0 -2.45269,0.82286 -2.91042,1.98438 0.45773,1.16152 1.5875,1.98437 2.91042,1.98437 1.32292,0 2.45269,-0.82285 2.91042,-1.98437 -0.45773,-1.16152 -1.5875,-1.98438 -2.91042,-1.98438 z m 0,3.3073 c -0.73025,0 -1.32292,-0.59267 -1.32292,-1.32292 0,-0.73025 0.59267,-1.32292 1.32292,-1.32292 0.73025,0 1.32292,0.59267 1.32292,1.32292 0,0.73025 -0.59267,1.32292 -1.32292,1.32292 z m 0,-2.11667 c -0.43921,0 -0.79375,0.35454 -0.79375,0.79375 0,0.43921 0.35454,0.79375 0.79375,0.79375 0.43921,0 0.79375,-0.35454 0.79375,-0.79375 0,-0.43921 -0.35454,-0.79375 -0.79375,-0.79375 z m -1.5875,-1.1905 c -1.32292,0 -2.45269,0.82286 -2.91042,1.98438 0.45773,1.16152 1.5875,1.98437 2.91042,1.98437 0.0481,0 0.0961,-0.001 0.14366,-0.004 -0.79949,-0.3713 -1.43411,-1.04091 -1.75907,-1.86552 -0.0291,-0.0735 -0.0291,-0.15646 0,-0.22996 0.32517,-0.82515 0.9604,-1.4954 1.76062,-1.86656 -0.048,-0.002 -0.0966,-0.003 -0.14521,-0.003 z"/></svg>`;
        const iconEyeOffDouble = `<svg viewBox="0 0 7.7232356 5.3631001" style="width: 22px; height: 18px;"><path d="M 1.52652,0.3359 M 1.19062,0.67179 L 1.64899,1.13068 C 0.89807,1.4628 0.30239,2.08209 0,2.84944 C 0.45773,4.01096 1.5875,4.83381 2.91042,4.83381 C 2.95852,4.83381 3.00652,4.83276 3.05408,4.83071 C 2.25459,4.45942 1.61997,3.7898 1.29501,2.96519 C 1.26591,2.89169 1.26591,2.80822 1.29501,2.73472 C 1.47102,2.28807 1.73805,1.88729 2.07274,1.55443 L 2.29392,1.7756 C 1.98987,2.07829 1.7476,2.44317 1.5875,2.84944 C 2.04523,4.01096 3.175,4.83381 4.49792,4.83381 C 4.75987,4.83381 5.01447,4.80156 5.25756,4.7408 L 5.88181,5.36298 L 6.21771,5.02708 L 5.44256,4.25452 L 2.65669,1.46606 L 2.65617,1.46606 L 2.58692,1.39681 L 2.43293,1.2423 L 2.14922,0.9586 L 2.1301,0.93948 L 1.52652,0.3359 z M 2.91042,0.86455 L 2.91042,0.86506 C 2.85077,0.86506 2.79147,0.86693 2.73265,0.87023 L 2.84014,0.97772 L 2.84065,0.97772 C 2.9109,0.93893 2.98252,0.90259 3.05563,0.86868 C 3.00763,0.86668 2.95903,0.86455 2.91042,0.86455 z M 4.49792,0.86506 C 3.98408,0.86506 3.49914,0.98932 3.07165,1.20923 L 3.67574,1.81333 C 3.90154,1.63394 4.18735,1.52652 4.49792,1.52652 C 5.22817,1.52652 5.82083,2.11919 5.82083,2.84944 C 5.82083,3.16001 5.71341,3.44582 5.53403,3.67161 L 6.19497,4.33255 L 6.19549,4.33255 C 6.7397,3.97942 7.16717,3.46139 7.40833,2.84944 C 6.9506,1.68792 5.82084,0.86506 4.49792,0.86506 z M 4.49792,2.05569 C 4.33323,2.05569 4.18067,2.10561 4.05402,2.19108 L 5.15627,3.29386 C 5.24174,3.1672 5.29167,3.01413 5.29167,2.84944 C 5.29167,2.41023 4.93713,2.05569 4.49792,2.05569 z M 3.1874,2.67012 L 4.67672,4.16047 C 4.61823,4.16839 4.55857,4.17236 4.49792,4.17236 C 3.76767,4.17236 3.175,3.57969 3.175,2.84944 C 3.175,2.7886 3.17944,2.72879 3.1874,2.67012 z"/></svg>`;


        // Expose helpers so add-on scripts (e.g. edit-pages-addon.html) can reuse them.
        window.BookStackPagePreview = {
            iconEye,
            iconEyeOff,
            loadPreview,
        };

        function loadPreview(url, previewDiv) {
            previewDiv.innerHTML = '<div class="preview-inner text-muted">Loading...</div>';
            fetch(url)
                .then(response => response.text())
                .then(html => {
                    const doc = new DOMParser().parseFromString(html, 'text/html');
                    const pageContent = doc.querySelector('.page-content');
                    if (pageContent) {
                        pageContent.querySelectorAll('script').forEach(s => s.remove());
                        previewDiv.innerHTML = `<div class="preview-inner">${pageContent.innerHTML}</div>`;
                    } else {
                        previewDiv.innerHTML = '<div class="preview-inner text-muted">Preview unavailable.</div>';
                    }
                }).catch(() => {
                    previewDiv.innerHTML = '<div class="preview-inner text-muted">Failed to load preview.</div>';
                });
        }

        pageLinks.forEach(link => {
            const url = link.href;

            const container = document.createElement('div');
            container.className = 'page-preview-container';
            link.parentNode.insertBefore(container, link);
            container.appendChild(link);

            const previewDiv = document.createElement('div');
            previewDiv.className = 'custom-page-preview';
            container.appendChild(previewDiv);

            const actionsWrapper = document.createElement('div');
            actionsWrapper.className = 'page-preview-actions';

            const viewBtn = document.createElement('button');
            viewBtn.className = 'quick-view-btn title-action print-hidden';
            viewBtn.title = "Show Preview";
            viewBtn.innerHTML = iconEye;
            actionsWrapper.appendChild(viewBtn);
            link.appendChild(actionsWrapper);

            // Per-container state, exposed for add-ons.
            const state = { hasLoadedPreview: false, isEditing: false };
            container._previewState = state;
            container._previewUrl = url;
            container._previewDiv = previewDiv;
            container._viewBtn = viewBtn;

            viewBtn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();

                const isOpen = previewDiv.classList.contains('is-open');

                if (isOpen) {
                    // Prevent closing if currently editing
                    if (state.isEditing) {
                        alert('Please save or cancel your changes before closing the preview.');
                        return;
                    }
                    
                    previewDiv.classList.remove('is-open');
                    viewBtn.innerHTML = iconEye;
                    viewBtn.title = "Show Preview";
                } else {
                    previewDiv.classList.add('is-open');
                    viewBtn.innerHTML = iconEyeOff;
                    viewBtn.title = "Hide Preview";

                    if (!state.hasLoadedPreview && !state.isEditing) {
                        loadPreview(url, previewDiv);
                        state.hasLoadedPreview = true;
                    }
                }
            });


            container.dispatchEvent(new CustomEvent('preview-container-ready', { bubbles: true }));
        });


        // Expand/Collapse All Previews" button
        // Button appears only after the chapter list is expanded for the first time.
        const chapterLinks = document.querySelectorAll('.book-contents > a.chapter.entity-list-item[data-entity-type="chapter"]');
        chapterLinks.forEach(chapterLink => {
            const expansionDiv = chapterLink.nextElementSibling;
            if (!expansionDiv || !expansionDiv.classList.contains('chapter-expansion')) return;

            const childPreviews = expansionDiv.querySelectorAll('.page-preview-container');
            if (childPreviews.length === 0) return;

            const contentsList = expansionDiv.querySelector('.chapter-contents-list');
            if (!contentsList) return;

            let buttonAdded = false;
            let allExpanded = false;
            let expandAllBtn = null;

            function addExpandAllButton() {
                if (buttonAdded) return;
                buttonAdded = true;

                expandAllBtn = document.createElement('button');
                expandAllBtn.className = 'quick-view-btn chapter-expand-all-btn';
                expandAllBtn.title = 'Expand all previews in this chapter';
                expandAllBtn.innerHTML = iconEyeDouble;
                expandAllBtn.style.cssText = 'position:absolute;right:12px;top:50%;transform:translateY(-50%);z-index:10;';

                chapterLink.style.position = 'relative';
                chapterLink.appendChild(expandAllBtn);

                expandAllBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();

                    const containers = Array.from(expansionDiv.querySelectorAll('.page-preview-container'));
                    if (containers.length === 0) return;

                    const api = window.BookStackPagePreview || {};
                    const iconEye = api.iconEye || '';
                    const iconEyeOff = api.iconEyeOff || '';
                    const loadPreviewFn = api.loadPreview || null;

                    if (!allExpanded) {
                        // Expand all.
                        allExpanded = true;
                        expandAllBtn.classList.add('is-open');
                        expandAllBtn.innerHTML = iconEyeOffDouble;
                        expandAllBtn.title = 'Collapse all previews in this chapter';

                        containers.forEach(container => {
                            const previewDiv = container.querySelector('.custom-page-preview');
                            const viewBtn = container.querySelector('.page-preview-actions .quick-view-btn');
                            const link = container.querySelector('a.entity-list-item[data-entity-type="page"]');
                            const url = link ? link.href : null;

                            if (!previewDiv || previewDiv.classList.contains('is-open')) return;

                            previewDiv.classList.add('is-open');
                            if (viewBtn && iconEyeOff) {
                                viewBtn.innerHTML = iconEyeOff;
                                viewBtn.title = 'Hide Preview';
                            }

                            if (!previewDiv.dataset.previewLoaded && loadPreviewFn && url) {
                                loadPreviewFn(url, previewDiv);
                                previewDiv.dataset.previewLoaded = 'true';
                            }
                        });
                    } else {
                        // Collapse all.
                        allExpanded = false;
                        expandAllBtn.classList.remove('is-open');
                        expandAllBtn.innerHTML = iconEyeDouble;
                        expandAllBtn.title = 'Expand all previews in this chapter';

                        containers.forEach(container => {
                            const previewDiv = container.querySelector('.custom-page-preview');
                            const viewBtn = container.querySelector('.page-preview-actions .quick-view-btn');

                            if (!previewDiv || !previewDiv.classList.contains('is-open')) return;

                            // Skip if quick-edit is active.
                            if (container.querySelector('.quick-edit-textarea')) return;

                            previewDiv.classList.remove('is-open');
                            if (viewBtn && iconEye) {
                                viewBtn.innerHTML = iconEye;
                                viewBtn.title = 'Show Preview';
                            }
                        });
                    }
                });
            }

            // Show/hide the expand-all button in sync with the chapter toggle.
            function updateButtonVisibility() {
                const isOpen = contentsList.offsetParent !== null;
                if (isOpen && !buttonAdded) {
                    addExpandAllButton();
                }
                if (expandAllBtn) {
                    expandAllBtn.style.display = isOpen ? '' : 'none';
                }
            }

            // Observe style/class changes on the contents list (and its parent) to react to toggle clicks.
            const visibilityObserver = new MutationObserver(updateButtonVisibility);
            visibilityObserver.observe(contentsList, { attributes: true, attributeFilter: ['style', 'class'] });

            const parentEl = contentsList.parentElement;
            if (parentEl) {
                visibilityObserver.observe(parentEl, { attributes: true, attributeFilter: ['style', 'class'] });
            }

            // Also listen directly on the chapter toggle button for immediate response.
            const toggleBtn = expansionDiv.querySelector('.chapter-contents-toggle');
            if (toggleBtn) {
                toggleBtn.addEventListener('click', () => setTimeout(updateButtonVisibility, 10));
            }

            // Initial state: if chapter is already open on page load, show button now.
            updateButtonVisibility();
        });

        document.dispatchEvent(new CustomEvent('preview-pages-ready'));
    });
</script>
