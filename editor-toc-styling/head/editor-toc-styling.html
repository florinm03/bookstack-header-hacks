<!-- Clearer styles for the table of contents tab within the editor, improving the hierarchy visibility -->
<!-- Credit: https://github.com/vlad118 -->

<style>
    /* Hide the native anchored bullets for all subheaders */
    .sidebar-page-nav li:not([data-level="1"]) .sidebar-page-nav-bullet {
        display: none !important;
    }

    /* Add bullet points next to the subheader text */
    .sidebar-page-nav li:not([data-level="1"]) > a::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        background-color: #bbb;
        border-radius: 50%;
        margin-right: 10px;
        vertical-align: middle;
        margin-top: -2px;
    }

    /* Switch bullet colour for dark mode */
    html.dark-mode .sidebar-page-nav li:not([data-level="1"]) > a::before {
        background-color: #666;
    }

    /* Indent the links more to show hierarchy clearer*/
    .sidebar-page-nav li[data-level="3"] > a { padding-left: 16px !important; }
    .sidebar-page-nav li[data-level="4"] > a { padding-left: 32px !important; }
    .sidebar-page-nav li[data-level="5"] > a { padding-left: 48px !important; }
    .sidebar-page-nav li[data-level="6"] > a { padding-left: 64px !important; }
</style>
